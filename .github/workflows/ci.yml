name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install lightweight validation dependencies
        run: python -m pip install numpy opencv-python-headless

      - name: Compile application source
        run: python -m compileall app.py modules

      - name: Check ink-mask noise filtering
        run: |
          python - <<'PY'
          import cv2
          import numpy as np
          from modules.image_preprocessing import build_ink_mask, is_valid_text_fragment

          paper = np.full((240, 420, 3), 255, dtype=np.uint8)
          for y in range(20, 240, 40):
              cv2.line(paper, (0, y), (419, y), (220, 220, 220), 2)

          mask = build_ink_mask(paper)
          assert not is_valid_text_fragment(mask), "Notebook lines must not be treated as handwriting."
          PY

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet
